name: Fetch Shows

on:
  schedule:
    - cron: '0 * * * *'   # hourly UTC; the Pacific-time gate below only lets every 2nd hour through
  workflow_dispatch:        # "Run workflow" button: always runs, ignores the time gate
    inputs:
      full_sync:
        description: 'Re-read every record from Airtable (costs ~1 API call per 100 records)'
        type: boolean
        default: false

concurrency:
  group: fetch-shows
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Airtable's free plan allows 1,000 API calls a month per workspace.
      # A normal run costs 1 call, so 8 runs a day is ~240 calls a month.
      - name: Check Pacific time window
        id: gate
        run: |
          HOUR=$((10#$(TZ="America/Vancouver" date +%H)))
          echo "Local Victoria hour: $HOUR"
          # Runs at 10am, noon, 2, 4, 6, 8, 10pm and midnight Pacific
          if { [ "$HOUR" -ge 10 ] || [ "$HOUR" -eq 0 ]; } && [ $((HOUR % 2)) -eq 0 ]; then
            echo "in_window=true" >> "$GITHUB_OUTPUT"
          else
            echo "in_window=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repo
        if: steps.gate.outputs.in_window == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Set up Node
        if: steps.gate.outputs.in_window == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install image tool
        if: steps.gate.outputs.in_window == 'true' || github.event_name == 'workflow_dispatch'
        run: npm install --no-save --no-package-lock sharp@0.33.5

      - name: Sync shows from Airtable
        if: steps.gate.outputs.in_window == 'true' || github.event_name == 'workflow_dispatch'
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          FULL_SYNC: ${{ inputs.full_sync || 'false' }}
        run: node scripts/sync-shows.mjs

      - name: Commit updated shows
        if: steps.gate.outputs.in_window == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/shows.json assets/shows
          git diff --staged --quiet || git commit -m "chore: update shows cache [skip ci]"
          git pull --rebase
          git push
